<header class="site-header" id="top">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | prepend: ui.prefix | relative_url }}" aria-label="{{ ui.brand }}">
      <span class="site-brand__mark" aria-hidden="true">T</span>
      <span>TaoBuilds<span class="site-brand__dot">.</span></span>
    </a>
    <nav id="headerNav" class="site-nav" aria-label="{{ ui.navigation }}">
      <ul class="site-nav__list">
        {% include site-nav-links.html desktop=true %}
      </ul>
    </nav>
    {% assign alternate_default = site.data.i18n[ui.alternate_language].prefix | append: '/' %}
    <a class="site-language" href="{{ page.translation | default: alternate_default | relative_url }}" lang="{{ ui.alternate_language }}" hreflang="{{ ui.alternate_language }}">{{ ui.alternate_label }}</a>
    <details class="site-mobile-nav">
      <summary aria-label="{{ ui.menu_toggle }}"><span aria-hidden="true">☰</span><span>{{ ui.menu }}</span></summary>
      <nav aria-label="{{ ui.mobile_navigation }}" class="site-mobile-nav__panel">
        <ul>
          {% include site-nav-links.html %}
        </ul>
      </nav>
    </details>
  </div>
</header>
