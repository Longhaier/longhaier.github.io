{% assign current_tags = post.tags | default: page.tags %}
{% if current_tags.size > 0 %}
<span class="pageTag" aria-label="文章标签">
  {% for tag in current_tags %}
    <a href="{{ '/tag/' | relative_url }}#{{ tag | slugify }}" rel="tag">{{ tag | escape }}</a>{% unless forloop.last %} {% endunless %}
  {% endfor %}
</span>
{% endif %}
