{% assign current_categories = post.categories | default: page.categories %}
{% if current_categories.size > 0 %}
<span class="categories" aria-label="文章分类">
  {% for category in current_categories %}
    <a href="{{ '/category/' | relative_url }}#{{ category | slugify }}" rel="category">{{ category | escape }}</a>{% unless forloop.last %} {% endunless %}
  {% endfor %}
</span>
{% endif %}
