<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1d31">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 155 | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
  <!-- Same-origin stylesheet only: external font icon CSS was render-blocking on some networks. -->
  <!-- The small fallback keeps content usable if a cached/bad connection delays the CSS. -->
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html{max-width:100%;overflow-x:clip}
    body{margin:0;max-width:100%;overflow-wrap:anywhere;background:#f6f8fb;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    .site-header__inner,.home-container,.interior-container,.site-footer__inner{max-width:1160px;width:calc(100% - 36px);margin-inline:auto}
    .site-header__inner{display:flex;align-items:center;gap:18px;min-height:66px}
    .site-brand{flex-shrink:0}
    img,video,svg,iframe{max-width:100%;height:auto}
    pre{max-width:100%;overflow-x:auto}
    .site-mobile-nav{display:none}
    @media(max-width:980px){
      .site-nav{display:none}
      .site-mobile-nav{display:block;margin-left:auto}
      .home-hero__content,.interior-layout{display:block}
    }
  </style>
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v={{ site.github.build_revision | default: '20261121-responsive' }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  {% if site.baidu_tongji_id %}
  <script>var _hmt = _hmt || []; (function(){var h=document.createElement('script');h.src='https://hm.baidu.com/hm.js?{{ site.baidu_tongji_id }}';document.head.appendChild(h)})();</script>
  {% endif %}
  {% if site.google_analytics_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ site.google_analytics_id }}');</script>
  {% endif %}
  {% if page.mathjax %}
  <script type="text/x-mathjax-config">MathJax.Hub.Config({tex2jax:{inlineMath:[['$','$'],['\\(','\\)']]}});</script>
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
  {% endif %}
</head>
