---
layout: default
---
<main id="main-content" class="interior interior--reading">
  {% include interior-banner.html title=page.title description=page.description eyebrow="TAOBUILDS / PAGES" %}
  <div class="interior-container interior-layout">
    <div class="interior-main">
      <article class="interior-article interior-prose" data-toc-source>
        {{ content }}
      </article>
      <div class="interior-bottom-nav">
        <a href="{{ '/' | relative_url }}">← 返回首页</a>
        <a href="{{ '/archive/' | relative_url }}">阅读全部文章 ↗</a>
      </div>
    </div>
    <aside class="interior-aside" aria-label="页面导航">
      <div class="interior-aside__panel" data-toc-panel hidden>
        <p class="interior-aside__eyebrow">ON THIS PAGE</p>
        <h2>页面目录</h2>
        <nav class="interior-side-nav" data-toc-list aria-label="页面目录"></nav>
      </div>
      <div class="interior-aside__panel interior-aside__panel--subtle">
        <p class="interior-aside__eyebrow">EXPLORE MORE</p>
        <h2>继续探索</h2>
        <nav class="interior-side-nav">
          <a href="{{ '/archive/' | relative_url }}">文章归档 <span aria-hidden="true">↗</span></a>
          <a href="{{ '/category/' | relative_url }}">文章分类 <span aria-hidden="true">↗</span></a>
          <a href="{{ '/tag/' | relative_url }}">标签索引 <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </aside>
  </div>
</main>
<script src="{{ '/js/interior.js' | relative_url }}" defer></script>
